    <script>
        const itemsPerPage = 10; // 페이지당 항목 수
        let currentPageGroup = 1; // 현재 페이지 그룹 (1: 1~10, 2: 11~20, ...)
        let currentPage = 1; // 현재 페이지
        let totalPage = 10;
        let filteredOrders = []; // 현재 필터링된 데이터
        let responseData = [];
        let new_index = 0;

        function check_logout() {
            // 모든 쿠키 초기화
            document.cookie.split(";").forEach(cookie => {
                const [name] = cookie.split("=");
                document.cookie = `${name.trim()}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
            });

            // 로그아웃 메시지 출력 (선택 사항)
            alert("로그아웃 되었습니다.");

            // 리다이렉트
            setTimeout(() => {
                window.location.href = "http://13.209.183.72/ys_login.html";
            }, 100); // 메시지 표시 후 약간의 지연을 추가
        };


        // 특정 쿠키 값만 확인하는 함수
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null; // 쿠키가 없으면 null 반환
        }


        
        // 데이터 필터링 함수
        function filterData(criteria) {
            const now = new Date();
            filteredOrders = orders.filter(order => {
                const orderDate = new Date(order.stime);
                if (criteria === 'all') return true;
                if (criteria === '1day') return now - orderDate <= 24 * 60 * 60 * 1000;
                if (criteria === '3days') return now - orderDate <= 3 * 24 * 60 * 60 * 1000;
                if (criteria === '1week') return now - orderDate <= 7 * 24 * 60 * 60 * 1000;
                if (criteria === '1month') return now - orderDate <= 30 * 24 * 60 * 60 * 1000;
            });
            currentPage = 1; // 필터링 후 첫 페이지로 초기화
            currentPageGroup = 1; // 페이지 그룹도 초기화
            renderTable();
            renderPagination();
        }
        
        // 테이블 렌더링 함수
        function renderTable() {
            const table = document.getElementById('order-table');
            table.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            filteredOrders.slice(start, end).forEach((order, index) => {
                const row = `
                    <tr>
                        <td>${order.send_date}</td>
                        <td>${order.payment_type}</td>
                        <td>${order.payment}</td>
                        <td>${order.send_call}</td>
                        <td>${order.payment_name}</td>
                        <td>${order.receive_name}</td>
                        <td>${order.order_item}</td>
                        <td>${order.item_cnt}</td>
                        <td>${order.order_item2 || ''}</td>
                        <td>${order.item_cnt2 || ''}</td>
                        <td>${order.order_item3 || ''}</td>
                        <td>${order.item_cnt3 || ''}</td>
                        <td>${order.order_item4 || ''}</td>
                        <td>${order.item_cnt4 || ''}</td>
                        <td>${order.order_item5 || ''}</td>
                        <td>${order.item_cnt5 || ''}</td>
                        <td>${order.receive_call}</td>
                        <td>${order.box_cnt}</td>
                        <td>${order.receive_address_num}</td>
                        <td>${order.receive_address}</td>
                        <td>${order.receive_code}</td>
                        <td>${order.move}</td>
                        <td>${order.send_message}</td>
                        <td>${order.stime}</td>
                        <td style="display:none;">${order.order_index}</td>
                        <td><button onclick="editOrder(${index})">Edit</button></td>
                    </tr>
                `;
                table.innerHTML += row;
            });
        }
        
        // 페이지네이션 렌더링 함수
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            const totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
            totalPage = totalPages;
        
            const startPage = (currentPageGroup - 1) * itemsPerPage + 1;
            const endPage = Math.min(currentPageGroup * itemsPerPage, totalPages);
        
            // '<' 버튼 추가
            if (currentPageGroup > 1) {
                const prevButton = document.createElement('button');
                prevButton.textContent = '<';
                prevButton.onclick = () => {
                    currentPageGroup--;
                    renderPagination();
                    currentPage = (currentPageGroup - 1) * itemsPerPage + 1;
                    renderTable();
                };
                pagination.appendChild(prevButton);
            }
        
            // 페이지 번호 버튼 추가
            for (let i = startPage; i <= endPage; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                if (i === currentPage) button.classList.add('btn-primary');
                button.classList.add('btn', 'btn-outline-secondary');
                button.style.margin = '0 5px';
                button.onclick = () => {
                    currentPage = i;
                    renderTable();
                    renderPagination();
                };
                pagination.appendChild(button);
            }
        
            // '>' 버튼 추가
            if (endPage < totalPages) {
                const nextButton = document.createElement('button');
                nextButton.textContent = '>';
                nextButton.onclick = () => {
                    currentPageGroup++;
                    renderPagination();
                    currentPage = (currentPageGroup - 1) * itemsPerPage + 1;
                    renderTable();
                };
                pagination.appendChild(nextButton);
            }
        }
        
        // 초기 데이터 렌더링
        const orders = [
            // 예시 데이터
            {
                
            }
        ];

        function selectItem(name) {
            API.getItemData(-1, (resp) => {
                //console.log(resp);
                if (resp.success) {
                    responseData.length = 0; // 기존 내용을 초기화
                    responseData.push(...resp.payload); // payload 데이터를 data에 추가

                    // name을 사용하여 해당 요소 가져오기
                    const selectContainer = document.getElementById(name); // 'order-items' 대신 name 사용
                    selectContainer.innerHTML = ''; // 기존 내용을 초기화
                            
                    // 셀렉트 박스 생성
                    const selectBox = document.createElement('select');
                    selectBox.id = 'dynamic-select'; // 셀렉트 박스의 ID 설정
                            
                    // 기본 옵션 추가 (선택해주세요)
                    const defaultOption = document.createElement('option');
                    defaultOption.textContent = '선택안함'; // 기본 텍스트
                    defaultOption.value = '0'; // 기본값 설정
                    defaultOption.selected = true; // 기본값으로 선택됨
                    selectBox.appendChild(defaultOption);
        
                    // responseData 데이터를 옵션으로 추가
                    responseData.forEach(item2 => {
                        const option = document.createElement('option');
                        option.textContent = item2.i_value; // 항목 이름 사용
                        option.value = item2.item_index; // 아이템 인덱스를 값으로 설정
                        selectBox.appendChild(option);
                    });
        
                    // 셀렉트 박스를 select-container에 추가
                    selectContainer.appendChild(selectBox);
                           
                    // 선택된 아이템을 "order-items" 셀렉트 박스에 표시
                    selectBox.addEventListener('change', function() {
                        const selectedOption = selectBox.options[selectBox.selectedIndex];
                        const orderItems = document.getElementById('order-items');
                        orderItems.value = selectedOption.textContent; // 선택된 아이템을 input에 표시
                    });

                } else {
                    console.log('fail');
                }
            });
        }
        
        function fn_getData() {
            // check_login();
            API.getOrder(resp => {
                //console.log(resp);
                if (resp.success) {
                    orders.length = 0; // 기존 내용을 초기화
                    orders.push(...resp.payload);
                    filterData('all'); // 기본 필터로 초기화
                } else {
                    console.error('Failed to load orders.');
                }
            });
        }
        
        // 페이지 로드 시 기본 설정
        fn_getData();
        selectItem('order-items');
        selectItem('order-items2');
        selectItem('order-items3');
        selectItem('order-items4');

        function selectByIndexOrValue(name, indexOrValue) {
            // 빈칸이나 null인 경우, 아무 작업도 하지 않음
            if (indexOrValue === "" || indexOrValue === null || indexOrValue === '0') {
                return;
            }
        
            const selectBox = document.querySelector(`#${name} select`); // `name`에 해당하는 셀렉트 박스 찾기
            
            if (selectBox) {
                const options = selectBox.options;
                // indexOrValue가 숫자라면 인덱스로 처리, 그렇지 않으면 value로 처리
                if (typeof indexOrValue === 'number' || !isNaN(indexOrValue)) {
                    // index로 처리
                    const index = parseInt(indexOrValue, 10);
                    if (index >= 0 && index < options.length) {
                        selectBox.selectedIndex = index;
                    }
                } else {
                    // value로 처리
                    // responseData에서 indexOrValue와 일치하는 항목 찾기
                    const matchedItem = responseData.find(item => item.i_value === indexOrValue);
                    
                    if (matchedItem) {
                        // 일치하는 항목이 있으면 해당 item_index를 value로 선택
                        for (let i = 0; i < options.length; i++) {
                            if (options[i].value === matchedItem.item_index.toString()) {
                                selectBox.selectedIndex = i;  // 해당 option을 선택
                                break;
                            }
                        }
                    }
                }
            }
        }

        async function downloadAllPagesCSV() {
            let allCsvContent = ''; // 모든 데이터를 여기에 저장
            const table = document.querySelector('table');
            
            // 테이블이 존재하는지 확인
            if (!table) {
                console.error('테이블을 찾을 수 없습니다!');
                return;
            }
        
            // 테이블 헤더를 가져와서 CSV 내용에 추가
            const headers = Array.from(table.querySelectorAll('th'));
            const headerRow = headers.map(header => header.textContent).join(',') + '\n';
            allCsvContent += headerRow;
        
            // 각 페이지 처리
            while (currentPage <= totalPages) {
                // 현재 페이지 데이터가 로드될 때까지 대기
                await waitForPageData();
        
                // 현재 페이지의 데이터 수집
                const rows = Array.from(table.querySelectorAll('tbody tr'));
                let currentPageData = '';
                rows.forEach(row => {
                    const cells = Array.from(row.querySelectorAll('td'));
                    const rowData = cells.map(cell => {
                        let cellText = cell.textContent || cell.innerText;
                        return `"${cellText.replace(/"/g, '""')}"`;  // CSV 규격에 맞게 처리
                    }).join(',');
                    currentPageData += rowData + '\n';
                });
        
                // 이전 데이터와 중복 확인
                if (checkForDuplicates(currentPageData)) {
                    break; // 반복 중단
                }
        
                // 중복되지 않으면 데이터 추가
                allCsvContent += currentPageData;
        
                // 이전 데이터로 현재 페이지 데이터를 저장
                previousData = currentPageData;
        
                // 마지막 페이지가 아니라면 다음 페이지로 이동
                if (currentPage < totalPages) {
                    const pageButtons = document.querySelectorAll('.btn.btn-outline-secondary'); // 페이지 버튼들
                    const nextPageButton = Array.from(pageButtons).find(button => button.textContent == (currentPage + 1).toString());
                    if (nextPageButton) {
                        nextPageButton.click();
                        await waitForPageLoad();  // 페이지 로딩 대기
                    }
                }
        
                currentPage++;  // 페이지 번호 증가
            }
        
            // CSV 파일 다운로드를 위한 BOM 추가 및 저장
            const bom = '\ufeff';
            const blob = new Blob([bom + allCsvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', 'order_history_all_pages.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
        
        // 현재 페이지의 테이블 데이터가 로드될 때까지 기다리는 함수
        function waitForPageData() {
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    const rows = document.querySelectorAll('table tbody tr');
                    if (rows.length > 0) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 100);
            });
        }
        
        // 페이지 로딩이 끝날 때까지 대기 (페이지가 동적으로 로딩되는 경우 유용)
        function waitForPageLoad() {
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    const loadingIndicator = document.querySelector('.loading-indicator');
                    if (!loadingIndicator || loadingIndicator.style.display === 'none') {
                        clearInterval(interval);
                        resolve();
                    }
                }, 100);
            });
        }
        
        // 중복 데이터가 있는지 확인하는 함수
        function checkForDuplicates(currentPageData) {
            return previousData === currentPageData; // 이전 페이지와 데이터가 같으면 중복
        }
